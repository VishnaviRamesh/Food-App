<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
            text-align: center;
        }

        header {
            background-color: #ff4757;
            color: white;
            padding: 15px;
            font-size: 24px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .food-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .food-item img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .order-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        .quantity {
            width: 50px;
            text-align: center;
        }

        .total {
            font-size: 20px;
            margin-top: 20px;
        }

        .place-order {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            display: block;
            width: 100%;
        }
    </style>
    <script>
        function calculateTotal() {
            let total = 0;
            const items = document.querySelectorAll('.food-item');
            items.forEach(item => {
                const price = parseFloat(item.querySelector('span').textContent.match(/\d+/)[0]);
                const quantityInput = item.querySelector('.quantity');
                const quantity = parseInt(quantityInput.value) || 0;
                if (quantity > 0) {
                    total += price * quantity;
                }
            });
            document.getElementById('total-amount').textContent = 'Total: $' + total;
        }
        function placeOrder() {
            alert('Your order has been placed successfully!');
        }
    </script>
</head>

<body>
    <header>Food App</header>
    <div class="container">
        <div class="food-item">
            <img src="https://via.placeholder.com/50" alt="Burger">
            <span>Burger - $5</span>
            <input type="number" class="quantity" min="0" value="0" onchange="calculateTotal()">
            <button class="order-btn">Order</button>
        </div>
        <div class="food-item">
            <img src="https://via.placeholder.com/50" alt="Pizza">
            <span>Pizza - $8</span>
            <input type="number" class="quantity" min="0" value="0" onchange="calculateTotal()">
            <button class="order-btn">Order</button>
        </div>
        <div class="food-item">
            <img src="https://via.placeholder.com/50" alt="Pasta">
            <span>Pasta - $7</span>
            <input type="number" class="quantity" min="0" value="0" onchange="calculateTotal()">
            <button class="order-btn">Order</button>
        </div>
        <div class="food-item">
            <img src="https://via.placeholder.com/50" alt="Sushi">
            <span>Sushi - $12</span>
            <input type="number" class="quantity" min="0" value="0" onchange="calculateTotal()">
            <button class="order-btn">Order</button>
        </div>
        <div class="food-item">
            <img src="https://via.placeholder.com/50" alt="Salad">
            <span>Salad - $6</span>
            <input type="number" class="quantity" min="0" value="0" onchange="calculateTotal()">
            <button class="order-btn">Order</button>
        </div>
        <div class="food-item">
            <img src="https://via.placeholder.com/50" alt="Steak">
            <span>Steak - $15</span>
            <input type="number" class="quantity" min="0" value="0" onchange="calculateTotal()">
            <button class="order-btn">Order</button>
        </div>
        <div class="food-item">
            <img src="https://via.placeholder.com/50" alt="Tacos">
            <span>Tacos - $9</span>
            <input type="number" class="quantity" min="0" value="0" onchange="calculateTotal()">
            <button class="order-btn">Order</button>
        </div>
        <div class="total" id="total-amount">Total: $0</div>
        <button class="place-order" onclick="placeOrder()">Place Order</button>
    </div>
</body>

</html>
